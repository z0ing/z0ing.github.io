baseURL = 'https://z0ing.github.io/'
locale = 'zh-cn'
title = "Zou'Log"
theme = "PaperMod"

paginate = 10                                 # 首页每页显示文章数
enableRobotsTXT = true                        # 允许搜索引擎抓取

[params]
  description = "Hi, this is ZouMing. I’m documenting my learning notes in this blog"          # 这个只给搜索引擎和社交卡片用，不会显示在页面上
    # --- 文章页面 ---
  ShowReadingTime = true                      # 显示预计阅读时间
  ShowPostNavLinks = true                     # 显示上一篇/下一篇导航
  ShowBreadCrumbs = false                     # 显示面包屑导航
  ShowCodeCopyButtons = true                  # 代码块显示复制按钮
  ShowScrollToTop = true                      # 回到顶部按钮
  ShowToc = true                              # 显示文章目录(TOC)
  TocOpen = false                             # 目录默认折叠(true=展开)

  [params.homeInfoParams]
      # --- 首页展示 ---
    Title = "Welcome to Zou'Log"
    Content = "I'm documenting my learning notes in this blog."
  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/z0ing"

  [[params.socialIcons]]
    name = "email"
    url = "mailto:zouming90@yeah.com"

# 添加不蒜子计数
[params.busuanzi]
  enable = true
  # 是否开启全站独立访客数
  site_uv = true
  # 全站独立访客数前的图标或提示语
  site_uv_pre = '<i class="fa fa-user"></i>' 
  # 全站独立访客数后的图标或提示语
  site_uv_post = ''
  # 是否开启全站浏览量
  site_pv = true
  # 全站浏览量前的图标或提示语
  site_pv_pre = '<i class="fa fa-eye"></i>'
  # 全站浏览量后的图标或提示语
  site_pv_post = ''
  # 是否开启单页浏览量
  page_pv = true
  # 单页浏览量前的图标或提示语
  page_pv_pre = '<i class="far fa-eye fa-fw"></i>'
  # 单页浏览量后的图标或提示语
  page_pv_post = ''
  # 是否开启单页独立访客数
  page_uv = true
  # 单页独立访客数前的图标或提示语
  page_uv_pre = '<i class="fa fa-user"></i>'
  # 单页独立访客数后的图标或提示语
  page_uv_post = ''



[[menu.main]]
  identifier = "posts"
  name = "Posts"
  url = "/"
  weight = 5

[[menu.main]]
  identifier = "archives"
  name = "Archives"
  url = "/archives/"
  weight = 10

[[menu.main]]
  identifier = "tags"
  name = "Tags"
  url = "/tags/"
  weight = 15

[[menu.main]]
  identifier = "about"
  name = "About"
  url = "/about/"
  weight = 20

# 输出格式（确保 RSS 正常生成）
[outputs]
  home = ["HTML", "RSS", "JSON"]

# 标记语言配置（支持 Markdown 扩展语法）
[markup]
  [markup.highlight]
    style = "dracula"           # 代码高亮主题
    lineNos = false             # 不显示行号
    guessSyntax = true          # 自动识别代码语言